name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release (de trong = v<version trong pom.xml>)"
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build
        run: mvn -B -DskipTests clean package

      - name: Resolve version and tag
        id: meta
        shell: bash
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION, tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "BlizPocket v${{ steps.meta.outputs.version }}"
          target_commitish: ${{ github.sha }}
          files: target/BlizPocket-*.jar
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## BlizPocket v${{ steps.meta.outputs.version }}

            Build tự động từ GitHub Actions.

            ### Cài đặt
            1. Tải `BlizPocket-${{ steps.meta.outputs.version }}.jar`.
            2. Bỏ vào `plugins/`.
            3. Cài dependency cần dùng (Vault/EssentialsX, PlayerPoints, Geyser/Floodgate...).
            4. Khởi động server.

            Xem [README](https://github.com/foxstudio-201/BlizCraft/blob/main/README.md) và [Wiki](https://github.com/foxstudio-201/BlizCraft/wiki).
