  usage-admin-jackpot: "<red>Dùng: <yellow>/txa hu info|set|add|take [so_tien]</yellow></red>"
  usage-admin-collateral: "<red>Dùng: <yellow>/txa collateral &lt;player&gt;</yellow> hoặc <yellow>/txa collateral clear &lt;player&gt;</yellow></red>"
  usage-admin-cau: "<red>Dùng: <yellow>/txa cau set &lt;d1&gt; &lt;d2&gt; &lt;d3&gt;</yellow> | <yellow>/txa cau info</yellow> | <yellow>/txa cau off</yellow> | <yellow>/txa cau clear</yellow></red>"
  admin-help-header: "<gradient:#ffd166:#ef476f><bold>═══ BlizPocket Admin ═══</bold></gradient>"
  admin-help:
    - "<yellow>/txa reload</yellow> <gray>- tải lại config/messages/tiền tệ</gray>"
    - "<yellow>/txa save</yellow> <gray>- ghi ngay tài khoản, hũ, phiên, thế chấp xuống file</gray>"
    - "<yellow>/txa give &lt;player&gt; &lt;so_tien&gt;</yellow> <gray>- cộng BlizCoin</gray>"
    - "<yellow>/txa take &lt;player&gt; &lt;so_tien&gt;</yellow> <gray>- trừ BlizCoin</gray>"
    - "<yellow>/txa set &lt;player&gt; &lt;so_tien&gt;</yellow> <gray>- đặt số dư</gray>"
    - "<yellow>/txa reset &lt;player&gt;</yellow> <gray>- reset tài khoản</gray>"
    - "<yellow>/txa hu info|set|add|take [so_tien]</yellow> <gray>- quản lý hũ</gray>"
    - "<yellow>/txa forceend</yellow> <gray>- kết thúc phiên ngay</gray>"
    - "<yellow>/txa cancel</yellow> <gray>- huỷ phiên + hoàn tiền</gray>"
    - "<yellow>/txa start</yellow> <gray>- bắt đầu phiên mới</gray>"
    - "<yellow>/txa stats &lt;player&gt;</yellow> <gray>- thống kê chi tiết</gray>"
    - "<yellow>/txa room</yellow> <gray>- danh sách người trong phòng</gray>"
    - "<yellow>/txa collateral &lt;player&gt;</yellow> <gray>- xem hợp đồng thế chấp</gray>"
    - "<yellow>/txa collateral clear &lt;player&gt;</yellow> <gray>- tịch thu toàn bộ tài sản thế chấp</gray>"
    - "<yellow>/txa cau set &lt;d1&gt; &lt;d2&gt; &lt;d3&gt;</yellow> <gray>- đặt kết quả xúc xắc cho phiên hiện tại/kế tiếp</gray>"
    - "<yellow>/txa cau info|off</yellow> <gray>- xem/huỷ cầu đang đặt</gray>"
    - "<yellow>/txa cau clear</yellow> <gray>- xoá lịch sử cầu, reset cầu về 0</gray>"

