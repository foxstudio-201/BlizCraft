# =====================================================================================
#  BlizPocket - Tin nhắn & chữ trên GUI
# =====================================================================================
#  - Hỗ trợ MiniMessage (Paper/Adventure): <red>, <gradient:#...:#...>, <bold>...
#  - Placeholder dạng {ten}. Chỉ dùng các placeholder có trong ghi chú từng mục.
#  - Có thể thêm/bớt dòng lore bằng list (dấu -).
#  - Sau khi sửa: /txa reload
# =====================================================================================

